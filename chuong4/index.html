<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>My Website</title>
</head>
<body>
    <div id="full">
        <div id="page">
            <div id="header">
                <h1>My Website</h1>
            </div>
            <div id="navbar">
                <a href="#">Home</a>
                <a href="#">About</a>
                <a href="#">Contact</a>
            </div>

            <div id="main">
                <div class="slidebar">
                    <a href="#">Sidebar 1</a><br>
                    <a href="#">Sidebar 2</a><br>
                    <a href="#">Sidebar 3</a>
                </div>

                <div class="content">
                    <div class="post">
                        <img src="img/imaages.jpg"
                             alt="Image describing the HTML page structure">
                    </div>

                    <div class="post0">
                        <p>Lorem ipsum dolor sit amet</p>
                    </div>

                    <div class="post1">
                        <table>
                            <thead>
                                <tr>
                                    <th>Header 1</th>
                                    <th>Header 2</th>
                                    <th>Header 3</th>
                                    <th>Header 4</th>
                                    <th>Header 5</th>
                                </tr>
                            </thead>

                            <tbody>
                                <tr>
                                    <td>Content 1</td>
                                    <td>Content 2</td>
                                    <td>Content 3</td>
                                </tr>
                                <tr>
                                    <td>Data 1</td>
                                    <td>Data 2</td>
                                    <td>Data 3</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <div class="post2">
                        <label for="input1">Input 1:</label>
                        <input type="text" id="input1"
                               class="input1" placeholder="Enter input 1">

                        <label for="input2">Input 2:</label>
                        <input type="text" id="input2"
                               class="input2" placeholder="Enter input 2">
                    </div>
                    
                    <div class="post4">
                      <p class="badge">NEW</p>
                    </div>
                    <div class="post5">
                        <span class="post5">data1</span>
                        <span class="post5">data2</span>
                        <span class="post5">data3</span>
                        <span class="post5">data4</span>
                        <span class="post5">data5</span>
                    </div>
                    <div class="post6">
                        <div class="post6">HTML</div>
                        <div class="post6">CSS</div>
                        <div class="post6">PHP</div>
                        <div class="post6">JAVA</div>
                        <div class="post6">C++</div>
                        <div class="post6">C#</div>
                    </div>
                    <div class="post7">
                        <button class="btn">Button 1</button>
                        <button class="btn danger">Button 2</button>
                    </div>
                </div>
            </div>

            <div id="footer">
                <p>Copyright © 2024 My Website. All rights reserved.</p>
            </div>

        </div>
    </div>
</body>
</html>
